# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# - id: dsh-superagent-feishu
#   disabled: false
# DingTalk is optional: uncomment to enable its Source, then set the robot's dingtalk-bot on the DingTalk Source.
# - id: dsh-superagent-dingtalk
#   disabled: false
# An installation works on one code host. For a self-hosted GitLab in place of GitHub, uncomment these two, then set the project and
# the agent's glab on the GitLab Source.
# - id: dsh-superagent-github
#   disabled: true
# - id: dsh-superagent-gitlab
#   disabled: false
